<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="canvas-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>

    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0.96"/>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Accent / Flow Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <style>
      .beacon-ring {
        animation: pulseRing 3.6s cubic-bezier(0.2, 0.6, 0.35, 1) infinite;
        transform-origin: center;
      }
      .beacon-ring-delayed {
        animation: pulseRing 3.6s cubic-bezier(0.2, 0.6, 0.35, 1) 1.8s infinite;
        transform-origin: center;
      }
      .beacon-ring-2 {
        animation: pulseRing 4.2s cubic-bezier(0.2, 0.6, 0.35, 1) 0.9s infinite;
        transform-origin: center;
      }
      .beacon-ring-3 {
        animation: pulseRing 4s cubic-bezier(0.2, 0.6, 0.35, 1) 2.2s infinite;
        transform-origin: center;
      }
      .data-packet {
        animation: packetPulse 2s ease-in-out infinite alternate;
      }
      .mesh-line {
        stroke-dasharray: 6 6;
        animation: streamFlow 25s linear infinite;
      }
      .mesh-line-rev {
        stroke-dasharray: 6 6;
        animation: streamFlowRev 22s linear infinite;
      }
      .satellite-float {
        animation: satFloat 5s ease-in-out infinite;
      }
      .satellite-float-delayed {
        animation: satFloat 6s ease-in-out 2.5s infinite;
      }
      .badge-glow {
        animation: badgePulse 3s ease-in-out infinite alternate;
      }

      @keyframes pulseRing {
        0% {
          r: 12px;
          opacity: 0.85;
          stroke-width: 2.5px;
        }
        70% {
          r: 38px;
          opacity: 0.15;
          stroke-width: 1px;
        }
        100% {
          r: 48px;
          opacity: 0;
          stroke-width: 0.5px;
        }
      }

      @keyframes streamFlow {
        from { stroke-dashoffset: 240; }
        to { stroke-dashoffset: 0; }
      }

      @keyframes streamFlowRev {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 240; }
      }

      @keyframes satFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }

      @keyframes packetPulse {
        0% { opacity: 0.35; filter: brightness(1); }
        100% { opacity: 0.95; filter: brightness(1.6); }
      }

      @keyframes badgePulse {
        0% { stroke-opacity: 0.3; }
        100% { stroke-opacity: 0.75; }
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="320" fill="url(#canvas-bg)" rx="16"/>
  <rect width="1000" height="320" fill="url(#grid)" rx="16"/>

  <!-- Ambient Background Nebulas / Glows -->
  <circle cx="160" cy="160" r="140" fill="#38bdf8" opacity="0.07" filter="url(#glow)"/>
  <circle cx="840" cy="160" r="140" fill="#c084fc" opacity="0.08" filter="url(#glow)"/>
  <circle cx="500" cy="50" r="120" fill="#818cf8" opacity="0.05" filter="url(#glow)"/>

  <!-- DYNAMIC NETWORK BACKGROUND LAYER -->
  <g id="network-mesh" opacity="0.75">
    <!-- Transmission lines connecting distributed nodes to the central FL coordinator -->
    <!-- Left Silo Connections -->
    <path class="mesh-line" d="M 120 70 Q 250 100 450 140" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.6"/>
    <path class="mesh-line-rev" d="M 90 160 Q 220 160 440 160" fill="none" stroke="#818cf8" stroke-width="1.8" opacity="0.5"/>
    <path class="mesh-line" d="M 130 250 Q 250 220 450 180" fill="none" stroke="#34d399" stroke-width="1.8" opacity="0.6"/>

    <!-- Right Silo Connections -->
    <path class="mesh-line-rev" d="M 880 70 Q 750 100 550 140" fill="none" stroke="#c084fc" stroke-width="1.8" opacity="0.6"/>
    <path class="mesh-line" d="M 910 160 Q 780 160 560 160" fill="none" stroke="#f472b6" stroke-width="1.8" opacity="0.5"/>
    <path class="mesh-line-rev" d="M 870 250 Q 750 220 550 180" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.6"/>

    <!-- Cross-mesh peer to peer links -->
    <path d="M 120 70 Q 70 115 90 160" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3" opacity="0.35"/>
    <path d="M 90 160 Q 95 210 130 250" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="3 3" opacity="0.35"/>
    <path d="M 880 70 Q 925 115 910 160" fill="none" stroke="#c084fc" stroke-width="1" stroke-dasharray="3 3" opacity="0.35"/>
    <path d="M 910 160 Q 905 210 870 250" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3" opacity="0.35"/>

    <!-- LEFT SATELLITE NODES (Clients / Edge Devices) -->
    <!-- Node 1: Hospital/Healthcare Silo (Top Left) -->
    <g class="satellite-float" transform="translate(120, 70)">
      <circle class="beacon-ring" cx="0" cy="0" r="16" fill="none" stroke="#38bdf8"/>
      <circle class="beacon-ring-delayed" cx="0" cy="0" r="16" fill="none" stroke="#38bdf8"/>
      <circle cx="0" cy="0" r="18" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)"/>
      <path d="M -7 0 L 7 0 M 0 -7 L 0 7" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>
      <text x="0" y="32" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.5">HEALTHCARE SILO</text>
    </g>

    <!-- Node 2: Mobile/Edge Cluster (Mid Left) -->
    <g class="satellite-float-delayed" transform="translate(90, 160)">
      <circle class="beacon-ring-2" cx="0" cy="0" r="14" fill="none" stroke="#818cf8"/>
      <circle cx="0" cy="0" r="15" fill="#0f172a" stroke="#818cf8" stroke-width="2" filter="url(#glow)"/>
      <rect x="-4.5" y="-7.5" width="9" height="15" rx="2" fill="none" stroke="#818cf8" stroke-width="1.6"/>
      <circle cx="0" cy="4.5" r="1" fill="#818cf8"/>
      <text x="0" y="28" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.5">MOBILE EDGE</text>
    </g>

    <!-- Node 3: IoT Sensor Fleet (Bottom Left) -->
    <g class="satellite-float" transform="translate(130, 250)">
      <circle class="beacon-ring-3" cx="0" cy="0" r="15" fill="none" stroke="#34d399"/>
      <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#34d399" stroke-width="2.2" filter="url(#glow)"/>
      <polygon points="0,-7 6,5 -6,5" fill="none" stroke="#34d399" stroke-width="1.8"/>
      <text x="0" y="30" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.5">IOT SENSORS</text>
    </g>

    <!-- RIGHT SATELLITE NODES (Clients / Edge Devices) -->
    <!-- Node 4: FinTech / Banking Silo (Top Right) -->
    <g class="satellite-float" transform="translate(880, 70)">
      <circle class="beacon-ring-2" cx="0" cy="0" r="16" fill="none" stroke="#c084fc"/>
      <circle class="beacon-ring" cx="0" cy="0" r="16" fill="none" stroke="#c084fc"/>
      <circle cx="0" cy="0" r="18" fill="#0f172a" stroke="#c084fc" stroke-width="2.5" filter="url(#glow)"/>
      <!-- Vault / Lock icon -->
      <rect x="-6" y="-3" width="12" height="9" rx="1.5" fill="none" stroke="#c084fc" stroke-width="1.8"/>
      <path d="M -3.5 -3 L -3.5 -6 C -3.5 -7.8 3.5 -7.8 3.5 -6 L 3.5 -3" fill="none" stroke="#c084fc" stroke-width="1.8"/>
      <text x="0" y="32" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.5">BANKING SILO</text>
    </g>

    <!-- Node 5: Autonomous Vehicles / Fleet (Mid Right) -->
    <g class="satellite-float-delayed" transform="translate(910, 160)">
      <circle class="beacon-ring-3" cx="0" cy="0" r="14" fill="none" stroke="#f472b6"/>
      <circle cx="0" cy="0" r="15" fill="#0f172a" stroke="#f472b6" stroke-width="2" filter="url(#glow)"/>
      <!-- Radar / Signal icon -->
      <path d="M -6 4 A 8 8 0 0 1 6 4 M -3.5 1 A 4 4 0 0 1 3.5 1" fill="none" stroke="#f472b6" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="0" cy="4" r="1" fill="#f472b6"/>
      <text x="0" y="28" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.5">CONNECTED FLEET</text>
    </g>

    <!-- Node 6: Edge Computing Clusters (Bottom Right) -->
    <g class="satellite-float" transform="translate(870, 250)">
      <circle class="beacon-ring" cx="0" cy="0" r="15" fill="none" stroke="#38bdf8"/>
      <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2.2" filter="url(#glow)"/>
      <!-- Cloud Server Icon -->
      <rect x="-7" y="-6" width="14" height="4.5" rx="1" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
      <rect x="-7" y="1" width="14" height="4.5" rx="1" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="4" cy="-3.5" r="0.8" fill="#38bdf8"/>
      <circle cx="4" cy="3.5" r="0.8" fill="#38bdf8"/>
      <text x="0" y="30" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.5">EDGE SERVERS</text>
    </g>
  </g>

  <!-- FOREGROUND HERO CARD (Guaranteed foreground positioning & 100% legibility) -->
  <g id="foreground-hero" transform="translate(230, 35)">
    <!-- Protective High-Contrast Frosted Glass Card -->
    <rect width="540" height="250" rx="20" fill="url(#card-bg)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" class="badge-glow" filter="url(#card-shadow)"/>

    <!-- Subtle Inner Border Accent -->
    <rect x="1" y="1" width="538" height="248" rx="19" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

    <!-- Top Category Pill -->
    <g transform="translate(270, 36)">
      <rect x="-140" y="-14" width="280" height="28" rx="14" fill="url(#badge-grad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6"/>
      <text x="0" y="4" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="1.5">
        🔒 PRIVACY-FIRST COLLABORATIVE AI
      </text>
    </g>

    <!-- Main Title -->
    <text x="270" y="106" fill="url(#title-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="34" font-weight="900" text-anchor="middle" letter-spacing="0.5">
      Awesome Federated Learning
    </text>

    <!-- Subtitle -->
    <text x="270" y="142" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="500" text-anchor="middle" letter-spacing="0.3">
      Evolution, Variants, Secure Aggregation &amp; Real-World Applications
    </text>

    <!-- Divider Line -->
    <line x1="70" y1="168" x2="470" y2="168" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>

    <!-- Dynamic Feature Pills in Foreground -->
    <g transform="translate(55, 192)">
      <!-- Feature 1: FedAvg / Algorithms -->
      <g transform="translate(0, 0)">
        <rect width="125" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
        <circle cx="15" cy="15" r="4" fill="#38bdf8" class="data-packet"/>
        <text x="26" y="19" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">FedAvg &amp; Prox</text>
      </g>

      <!-- Feature 2: Differential Privacy -->
      <g transform="translate(140, 0)">
        <rect width="145" height="30" rx="15" fill="#1e293b" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6"/>
        <circle cx="15" cy="15" r="4" fill="#818cf8" class="data-packet"/>
        <text x="26" y="19" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">Differential Privacy</text>
      </g>

      <!-- Feature 3: Cross-Silo & Device -->
      <g transform="translate(300, 0)">
        <rect width="130" height="30" rx="15" fill="#1e293b" stroke="#34d399" stroke-width="1" stroke-opacity="0.6"/>
        <circle cx="15" cy="15" r="4" fill="#34d399" class="data-packet"/>
        <text x="26" y="19" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">Cross-Silo / Edge</text>
      </g>
    </g>
  </g>
</svg>
